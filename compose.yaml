services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    environment:
      OCTANE_SERVER: frankenphp
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      nuxt:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - rmt

  nuxt:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NUXT_API_BASE: "http://app/api"
      NUXT_PUBLIC_API_BASE: "/api"
      NITRO_PORT: "3000"
      NITRO_HOST: "0.0.0.0"
    expose:
      - "3000"
    networks:
      - rmt

  horizon:
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    command: php artisan horizon
    # Image HEALTHCHECK probes the Caddy admin endpoint, which the horizon
    # worker process does not serve — disable it to avoid a false "unhealthy".
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rmt

  mysql:
    image: 'mysql:8.4'
    restart: unless-stopped
    ports:
      - '${FORWARD_DB_PORT:-3307}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - rmt-mysql:/var/lib/mysql
    networks:
      - rmt
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      retries: 3
      timeout: 5s

  redis:
    image: 'redis:alpine'
    restart: unless-stopped
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - rmt-redis:/data
    networks:
      - rmt
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 3
      timeout: 5s

networks:
  rmt:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  rmt-mysql:
  rmt-redis:
